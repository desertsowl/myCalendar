<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール - myCal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background-color: #f8f9fa;
        }

        .header {
            background-color: #221e74;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        .header .app-name {
            margin-left: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .drawer-button {
            font-size: 1.5rem;
            color: #fff;
            background-color: transparent;
            border: none;
        }

        .footer {
            background-color: #221e74;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }

        .schedule-field {
            max-height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
        }

        .csv-btn {
            background-color: #006ba7;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
        }

        .csv-btn:hover {
            background-color: #005a93;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .form-select {
            padding: 5px;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            color: red;
            padding: 20px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .date-section {
            margin-bottom: 20px;
        }

        .event-row {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .time {
            display: inline-block;
            width: 100px;
            color: #666;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <button class="drawer-button" id="drawerButton">&#9776;</button>
        <span class="app-name">myCal</span>
    </header>

    <!-- Drawer Menu -->
    <div id="drawerMenu"
        style="display: none; background-color: #006ba7; color: #fff; padding: 10px; position: absolute; width: 100%; top: 50px; left: 0;">
        <a href="#" style="color: #fff; text-decoration: none;">ログアウト</a>
    </div>

    <!-- Main Content -->
    <div class="container my-4">
        <h2 class="text-center"><i class="bi bi-calendar-check"></i> スケジュール</h2>
        <div class="controls">
            <select id="nameSelector" class="form-select">
                <option value="">全員</option>
                {% for name in name_list %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
            
            <select id="monthSelector" class="form-select">
                {% for month in months %}
                <option value="{{ month.value }}" {% if month.selected %}selected{% endif %}>
                    {{ month.label }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div id="schedule-field">
            <!-- スケジュールデータがここに表示されます -->
        </div>

        <button class="csv-btn mt-3">CSV Output</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 myCal</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById('drawerButton').addEventListener('click', function () {
            const drawerMenu = document.getElementById('drawerMenu');
            drawerMenu.style.display = drawerMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('DOMContentLoaded', function() {
            const nameSelector = document.getElementById('nameSelector');
            const monthSelector = document.getElementById('monthSelector');
            const scheduleField = document.getElementById('schedule-field');
            
            async function updateSchedule() {
                const name = nameSelector.value;
                const monthOffset = monthSelector.value;
                
                try {
                    scheduleField.innerHTML = '<div class="loading">データを読み込み中...</div>';
                    
                    // 常に今月のデータを取得し、フロントエンドでフィルタリング
                    const response = await fetch(`/api/schedule?name=${encodeURIComponent(name)}&month_offset=${monthOffset}`);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'データの取得に失敗しました');
                    }
                    
                    // スケジュールの表示を更新
                    let html = '';
                    
                    if (Object.keys(data).length > 0) {
                        const entries = Object.entries(data);
                        
                        // 日付でソート（年、月、日を数値として比較）
                        entries.sort(([dateA], [dateB]) => {
                            const [yearA, monthA, dayA] = dateA.split('.').map(Number);
                            const [yearB, monthB, dayB] = dateB.split('.').map(Number);
                            
                            if (yearA !== yearB) return yearA - yearB;
                            if (monthA !== monthB) return monthA - monthB;
                            return dayA - dayB;
                        });
                        
                        for (const [date, events] of entries) {
                            html += `
                                <div class="date-section">
                                    <h3>${date}</h3>
                                    <div class="events">
                                        ${events.map(event => `
                                            <div class="event-row">
                                                <span class="time">${event.time}</span>
                                                <span class="title">${event.title}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    }
                    
                    scheduleField.innerHTML = html;
                    
                } catch (error) {
                    scheduleField.innerHTML = `<div class="error">${error.message}</div>`;
                }
            }
            
            nameSelector.addEventListener('change', updateSchedule);
            monthSelector.addEventListener('change', updateSchedule);
            
            updateSchedule();
        });
    </script>
</body>

</html>
