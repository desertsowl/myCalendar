<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール - myCal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background-color: #f8f9fa;
        }

        .header {
            background-color: #221e74;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        .header .app-name {
            margin-left: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .drawer-button {
            font-size: 1.5rem;
            color: #fff;
            background-color: transparent;
            border: none;
        }

        .footer {
            background-color: #221e74;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }

        .schedule-field {
            max-height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
        }

        .csv-btn {
            background-color: #006ba7;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
        }

        .csv-btn:hover {
            background-color: #005a93;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .form-select {
            padding: 5px;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            color: red;
            padding: 20px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .date-section {
            margin-bottom: 20px;
        }

        .event-row {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .time {
            display: inline-block;
            width: 100px;
            color: #666;
        }

        .title-row {
            border-bottom: double 3px #ccc;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        
        .processing-info {
            font-size: 0.7rem;
            color: #666;
            margin-left: 15px;
        }
        
        .refresh-button {
            padding: 5px 15px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <button class="drawer-button" id="drawerButton">&#9776;</button>
        <span class="app-name">myCal</span>
    </header>

    <!-- Drawer Menu -->
    <div id="drawerMenu"
        style="display: none; background-color: #006ba7; color: #fff; padding: 10px; position: absolute; width: 100%; top: 50px; left: 0;">
        <a href="#" style="color: #fff; text-decoration: none;">ログアウト</a>
    </div>

    <!-- Main Content -->
    <div class="container my-4">
        <div class="title-row">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <h2 class="mb-0">スケジュール</h2>
                    <span class="processing-info">
                        (処理:<span id="processingTime">-.-</span>秒 / 取得:<span id="cacheAge">-</span>前)
                    </span>
                </div>
                <button id="refreshButton" class="btn btn-outline-primary refresh-button">
                    <i class="bi bi-arrow-clockwise"></i> 更新
                </button>
            </div>
        </div>

        <div class="controls">
            <select id="nameSelector" class="form-select">
                <option value="">全員</option>
                {% for name in name_list %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
            
            <select id="monthSelector" class="form-select">
                {% for month in months %}
                <option value="{{ month.value }}" {% if month.selected %}selected{% endif %}>
                    {{ month.label }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div id="schedule-field">
            <!-- スケジュールデータがここに表示されます -->
        </div>

        <button class="csv-btn mt-3">CSV Output</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 myCal</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById('drawerButton').addEventListener('click', function () {
            const drawerMenu = document.getElementById('drawerMenu');
            drawerMenu.style.display = drawerMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('DOMContentLoaded', function() {
            const nameSelector = document.getElementById('nameSelector');
            const monthSelector = document.getElementById('monthSelector');
            const scheduleField = document.getElementById('schedule-field');
            const processingTimeEl = document.getElementById('processingTime');
            const cacheAgeEl = document.getElementById('cacheAge');
            
            async function updateSchedule() {
                const startTime = performance.now();
                try {
                    const name = nameSelector.value;
                    const monthOffset = monthSelector.value;
                    let html = '';
                    
                    const response = await fetch(`/api/schedule?name=${encodeURIComponent(name)}&month_offset=${monthOffset}`);
                    const responseData = await response.json();
                    
                    // Selenium処理時間を表示
                    if (responseData.selenium_time !== undefined) {
                        processingTimeEl.textContent = responseData.selenium_time.toFixed(2);
                    }
                    
                    // キャッシュの経過時間を取得して表示
                    if (responseData.cache_age) {
                        const minutes = Math.floor(responseData.cache_age / 60);
                        cacheAgeEl.textContent = `${minutes}分`;
                    }
                    
                    if (!response.ok) {
                        throw new Error(responseData.error || 'データの取得に失敗しました');
                    }
                    
                    const data = responseData.data;  // データは.dataプロパティに格納されている
                    
                    if (Object.keys(data).length > 0) {
                        const entries = Object.entries(data);
                        
                        // 日付でソート（年、月、日を数値として比較）
                        entries.sort(([dateA], [dateB]) => {
                            const [yearA, monthA, dayA] = dateA.split('.').map(Number);
                            const [yearB, monthB, dayB] = dateB.split('.').map(Number);
                            
                            if (yearA !== yearB) return yearA - yearB;
                            if (monthA !== monthB) return monthA - monthB;
                            return dayA - dayB;
                        });
                        
                        for (const [date, events] of entries) {
                            if (Array.isArray(events)) {  // eventsが配列であることを確認
                                html += `
                                    <div class="date-section">
                                        <h3>${date}</h3>
                                        <div class="events">
                                            ${events.map(event => `
                                                <div class="event-row">
                                                    <span class="time">${event.time}</span>
                                                    <span class="title">${event.title}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }
                        }
                    }
                    
                    scheduleField.innerHTML = html || '<div class="no-data">該当する月のスケジュールはありません</div>';
                    
                } catch (error) {
                    console.error('Error:', error);
                    scheduleField.innerHTML = `<div class="error">${error.message}</div>`;
                }
            }
            
            // 更新ボタンのクリックイベント
            document.getElementById('refreshButton').addEventListener('click', async function() {
                try {
                    this.disabled = true;
                    this.innerHTML = '<i class="bi bi-arrow-clockwise"></i> 更新中...';
                    
                    const response = await fetch('/refresh_cache');
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error('キャッシュの更新に失敗しました');
                    }
                    
                    // Selenium処理時間を更新
                    if (data.selenium_time) {
                        document.getElementById('processingTime').textContent = 
                            data.selenium_time.toFixed(2);
                    }
                    
                    window.location.reload();
                } catch (error) {
                    alert(error.message);
                    this.disabled = false;
                    this.innerHTML = '<i class="bi bi-arrow-clockwise"></i> 更新';
                }
            });
            
            nameSelector.addEventListener('change', updateSchedule);
            monthSelector.addEventListener('change', updateSchedule);
            
            updateSchedule();
        });
    </script>
</body>

</html>
