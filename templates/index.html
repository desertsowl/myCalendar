<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール - myCal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background-color: #f8f9fa;
        }

        .header {
            background-color: #221e74;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        .header .app-name {
            margin-left: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .drawer-button {
            font-size: 1.5rem;
            color: #fff;
            background-color: transparent;
            border: none;
        }

        .footer {
            background-color: #221e74;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }

        .schedule-field {
            max-height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
        }

        .csv-btn {
            background-color: #006ba7;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
        }

        .csv-btn:hover {
            background-color: #005a93;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <button class="drawer-button" id="drawerButton">&#9776;</button>
        <span class="app-name">myCal</span>
    </header>

    <!-- Drawer Menu -->
    <div id="drawerMenu"
        style="display: none; background-color: #006ba7; color: #fff; padding: 10px; position: absolute; width: 100%; top: 50px; left: 0;">
        <a href="#" style="color: #fff; text-decoration: none;">ログアウト</a>
    </div>

    <!-- Main Content -->
    <div class="container my-4">
        <h2 class="text-center"><i class="bi bi-calendar-check"></i> スケジュール</h2>
        <form>
            <div class="mb-3">
                <label for="month" class="form-label">Month</label>
                <select id="month" class="form-select" name="month_offset">
                    {% for month in months %}
                    <option value="{{ month.value }}" {% if month.selected %}selected{% endif %}>{{ month.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <select id="name" class="form-select" name="name">
                    {% for name in name_list %}
                    <option value="{{ name }}">{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
        <div class="schedule-field">
            {% for day in schedule_data %}
            <div class="mb-4">
                <h4 class="text-primary">{{ day.date }}</h4>
                <div>
                    {% for individual in day.individuals %}
                    <h5 class="text-secondary">{{ individual.person }}</h5>
                    <ul>
                        {% for event in individual.events %}
                        <li>{{ event.time }} - {{ event.event_name }}</li>
                        {% endfor %}
                    </ul>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
        <button class="csv-btn mt-3">CSV Output</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 dSheet</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById('drawerButton').addEventListener('click', function () {
            const drawerMenu = document.getElementById('drawerMenu');
            drawerMenu.style.display = drawerMenu.style.display === 'block' ? 'none' : 'block';
        });
    </script>
</body>

</html>
